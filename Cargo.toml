[workspace]
members = [
    "crates/chiaro",
    "crates/chiaro-proto",
    "apps/gallery",
    "apps/hotpixel",
]
default-members = ["apps/gallery", "apps/hotpixel"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1.0"
futures = "0.3.31"
hex = "0.4"
chiaro = { path = "crates/chiaro" }
chiaro-proto = { path = "crates/chiaro-proto" }
memmap2 = "0.9.10"
mtp-rs = "0.25.0"
nusb = { version = "0.2.5", default-features = false }
png = "0.17"
protobuf = { version = "=3.6.0", features = ["with-bytes"] }
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.12"
thiserror = "2.0.18"
walkdir = "2.5"
zune-jpeg = { version = "0.3.17", default-features = false, features = ["std", "x86"] }

[profile.release]
lto = "thin"
codegen-units = 1
