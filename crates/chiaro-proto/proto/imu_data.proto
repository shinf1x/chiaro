syntax = "proto2";

package ltpb;

import "point3f.proto";

message IMUData {
    optional uint32 frame_index = 1;
    
    repeated Sample accelerometer = 2;
    message Sample {
        optional uint32 row_idx = 1;
        optional Point3F data = 2;
    }
    
    repeated Sample gyroscope = 3;
}
