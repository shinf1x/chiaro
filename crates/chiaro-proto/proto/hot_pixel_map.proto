syntax = "proto2";

package ltpb;

message HotPixelMap {
    repeated HotPixelMeasurement data = 1;
    message HotPixelMeasurement {
        optional uint64 data_offset = 1;
        optional uint32 data_size = 2;
        optional uint32 data_exposure = 3;
        optional int32 sensor_temparature = 4;
        optional float sensor_gain = 5;
        optional float pixel_variance = 6;
        optional float threshold = 7;
    }
}
