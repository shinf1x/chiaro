syntax = "proto2";

package ltpb;

message Matrix4x4F {
    optional float x00 = 1;
    optional float x01 = 2;
    optional float x02 = 3;
    optional float x03 = 4;
    optional float x10 = 5;
    optional float x11 = 6;
    optional float x12 = 7;
    optional float x13 = 8;
    optional float x20 = 9;
    optional float x21 = 10;
    optional float x22 = 11;
    optional float x23 = 12;
    optional float x30 = 13;
    optional float x31 = 14;
    optional float x32 = 15;
    optional float x33 = 16;
}
